<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0d09" />
<title>iCook – Dein digitales Rezeptbuch</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ============ iCook – Olive & Schwarz ============ */
:root {
  color-scheme: dark;
  --bg: #0a0d09;
  --bg-2: #0f130d;
  --surface: #141a12;
  --surface-2: #1b2218;
  --surface-3: #252e20;
  --border: #20281c;
  --border-strong: #2f3929;
  --text: #f1f3ea;
  --text-2: #c4cab7;
  --muted: #8a927e;
  --accent: #aab86c;
  --accent-ink: #f3f5e8;
  --accent-fill: #5c692b;
  --accent-glow: rgb(111 125 54 / 0.55);
  --danger: #ff7a7a;
  --warn: #f2b45a;
  --star: #f6c453;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 10px 30px -12px rgb(0 0 0 / 0.6);
  --font: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
  --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --sidebar: 248px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(900px 520px at 90% -8%, rgb(74 96 44 / 0.32), transparent 65%),
    radial-gradient(700px 500px at -10% 105%, rgb(52 70 32 / 0.22), transparent 60%),
    linear-gradient(180deg, #0d120b, var(--bg) 40%);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
body.no-scroll { overflow: hidden; }
h1, h2, h3 { line-height: 1.2; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.6rem, 3vw, 2.1rem); font-weight: 800; }
h2 { font-size: 1.15rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 700; }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.tiny { font-size: 0.75rem; }
.center { text-align: center; }
.cap { text-transform: capitalize; }
.pre { white-space: pre-wrap; }
.icon { flex-shrink: 0; }

/* ---------- Layout ---------- */
.app-shell { min-height: 100vh; }
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: var(--sidebar);
  padding: 22px 16px; display: flex; flex-direction: column; gap: 20px;
  background: color-mix(in srgb, var(--bg-2) 85%, transparent);
  border-right: 1px solid var(--border);
  backdrop-filter: blur(12px);
  z-index: 20;
}
.logo { display: flex; align-items: center; gap: 10px; font-size: 1.35rem; padding: 0 6px; }
.logo-mark {
  width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center;
  background: var(--accent-fill); color: var(--accent-ink);
  box-shadow: 0 6px 18px -6px var(--accent);
}
.logo-text { font-weight: 500; letter-spacing: -0.02em; }
.logo-text strong { font-weight: 800; }
.side-nav { display: flex; flex-direction: column; gap: 4px; }
.side-link {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px;
  color: var(--text-2); font-weight: 500; transition: background .15s, color .15s;
}
.side-link:hover { background: var(--surface); color: var(--text); }
.side-link.active { background: var(--surface-2); color: var(--text); box-shadow: inset 3px 0 0 var(--accent); }
.side-link.active .icon { color: var(--accent); }
.sidebar-foot { margin-top: auto; font-size: 0.75rem; display: flex; gap: 8px; align-items: flex-start; padding: 0 6px; }
.badge {
  margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px;
  background: var(--accent-fill); color: var(--accent-ink); font-size: 0.72rem; font-weight: 700;
  display: inline-grid; place-items: center;
}
.badge.inline { margin-left: 4px; }

.main { margin-left: var(--sidebar); padding: 32px clamp(16px, 4vw, 48px) 80px; }
.topbar, .bottom-nav, .fab { display: none; }

.page { max-width: 1240px; margin: 0 auto; animation: fade-in .25s ease; }
.page.narrow { max-width: 820px; }
@keyframes fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.page-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.page-header p { margin-top: 6px; }
.page-actions { display: flex; gap: 10px; flex-wrap: wrap; }

.section { margin-top: 34px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.small-title { font-size: 0.95rem; margin-top: 24px; }
.link, .link-btn { color: var(--accent); font-weight: 600; font-size: 0.88rem; background: none; border: 0; padding: 0; }
.link-btn { margin-left: 10px; }
.link:hover, .link-btn:hover { text-decoration: underline; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 16px; border-radius: 12px; border: 1px solid transparent;
  font-weight: 600; font-size: 0.92rem; white-space: nowrap;
  transition: transform .12s, background .15s, border-color .15s, box-shadow .15s, opacity .15s;
}
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent-fill); color: var(--accent-ink); box-shadow: 0 8px 22px -12px var(--accent); }
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn-outline { background: var(--surface); border-color: var(--border); color: var(--text); }
.btn-outline:hover:not(:disabled), .btn-outline.is-on { border-color: var(--accent); }
.btn-outline.is-on { color: var(--accent); }
.btn-ghost { background: transparent; color: var(--text-2); }
.btn-ghost:hover:not(:disabled) { background: var(--surface); color: var(--text); }
.btn-danger { background: var(--danger); color: #2a0606; }
.danger-text { color: var(--danger) !important; }
.btn-sm { padding: 7px 12px; font-size: 0.85rem; border-radius: 10px; }
.btn-lg { padding: 13px 22px; font-size: 1rem; }
.btn-block { width: 100%; }

.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; display: inline-grid; place-items: center;
  background: transparent; border: 1px solid transparent; color: var(--text-2); transition: background .15s, color .15s;
}
.icon-btn:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
.icon-btn:disabled { opacity: .3; cursor: not-allowed; }
.icon-btn.sm { width: 32px; height: 32px; border-radius: 9px; }
.icon-btn.danger:hover { color: var(--danger); }
.icon-btn.glass { background: rgb(10 15 17 / 0.55); backdrop-filter: blur(10px); color: #fff; border-color: rgb(255 255 255 / 0.08); }

/* ---------- Form controls ---------- */
input:not([type=checkbox]):not([type=file]), select, textarea {
  width: 100%; background: var(--bg-2); border: 1px solid var(--border); border-radius: 12px;
  padding: 11px 14px; outline: none; transition: border-color .15s, box-shadow .15s;
}
textarea { resize: vertical; min-height: 44px; }
input::placeholder, textarea::placeholder { color: #687060; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
input[aria-invalid=true], input.invalid { border-color: var(--danger); }
select { appearance: none; padding-right: 32px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.select-sm { width: auto !important; padding: 9px 32px 9px 12px !important; font-size: 0.88rem; }

.field { display: flex; flex-direction: column; gap: 7px; }
.label { font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.field-error { color: var(--danger); font-size: 0.85rem; display: flex; gap: 6px; align-items: center; }
.field-warn { color: var(--warn); font-size: 0.85rem; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.field-warn a { text-decoration: underline; }
.form-stack { display: flex; flex-direction: column; gap: 18px; }

.search-bar {
  display: flex; align-items: center; gap: 10px; flex: 1 1 260px; min-width: 0;
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 4px 6px 4px 14px; color: var(--muted);
  transition: border-color .15s, box-shadow .15s;
}
.search-bar:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent); }
.search-bar input { min-width: 0; border: 0 !important; background: transparent !important; box-shadow: none !important; padding: 9px 0 !important; color: var(--text); }
.search-bar.big { padding: 6px 6px 6px 18px; border-radius: 18px; max-width: 640px; }
.search-bar.big input { font-size: 1.02rem; padding: 12px 0 !important; }

.segmented { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.segmented button { background: transparent; border: 0; border-radius: 9px; padding: 6px 12px; color: var(--text-2); font-size: 0.86rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.segmented button:hover { color: var(--text); }
.segmented button.active { background: var(--surface-3); color: var(--accent); }

.toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 500; }
.toggle input { position: absolute; opacity: 0; pointer-events: none; }
.toggle-ui { width: 42px; height: 24px; border-radius: 99px; background: var(--surface-3); position: relative; transition: background .2s; flex-shrink: 0; }
.toggle-ui::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #cfd8d4; transition: transform .2s; }
.toggle input:checked + .toggle-ui { background: var(--accent-fill); }
.toggle input:checked + .toggle-ui::after { transform: translateX(18px); background: var(--accent-ink); }
.toggle input:focus-visible + .toggle-ui { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Chips ---------- */
.chip-row { display: flex; gap: 8px; }
.chip-row.wrap { flex-wrap: wrap; }
.scroll-x { overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
.scroll-x::-webkit-scrollbar { display: none; }
.chip {
  --chip-color: var(--accent);
  display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 99px;
  background: var(--surface); border: 1px solid var(--border); color: var(--text-2);
  font-size: 0.88rem; font-weight: 600; white-space: nowrap; transition: all .15s;
}
button.chip:hover { border-color: var(--chip-color); color: var(--text); }
.chip.active { background: color-mix(in srgb, var(--chip-color) 18%, var(--surface)); border-color: var(--chip-color); color: var(--text); }
.chip-sm { padding: 5px 11px; font-size: 0.8rem; gap: 5px; }
.chip.warn { --chip-color: var(--warn); }
.chip.warn:not(.active) { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.chip-icon { font-size: 1em; line-height: 1; }
.removable { cursor: pointer; }

/* ---------- Home ---------- */
.hero { padding: 18px 0 6px; }
.eyebrow { color: var(--accent); font-weight: 700; font-size: 0.9rem; margin-bottom: 8px; }
.hero-title { font-size: clamp(2rem, 5vw, 3.1rem); font-weight: 800; letter-spacing: -0.03em; margin-bottom: 22px; }
.hero-actions { display: flex; align-items: center; gap: 14px; margin-top: 16px; flex-wrap: wrap; }

.featured { position: relative; display: block; border-radius: 24px; overflow: hidden; height: clamp(240px, 34vw, 360px); border: 1px solid var(--border); box-shadow: var(--shadow); }
.featured .recipe-img { width: 100%; height: 100%; transition: transform .5s; }
.featured:hover .recipe-img { transform: scale(calc(var(--zoom, 1) * 1.03)); }
.featured .placeholder-emoji { font-size: 7rem; }
.featured-overlay {
  position: absolute; inset: auto 0 0 0; padding: 60px 26px 22px;
  background: linear-gradient(transparent, rgb(8 12 13 / 0.92));
  display: flex; flex-direction: column; gap: 8px;
}
.featured-overlay h3 { font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 800; }
.featured-overlay p { color: var(--text-2); max-width: 560px; }
.pill { align-self: flex-start; display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 99px; background: var(--accent-fill); color: var(--accent-ink); font-size: 0.75rem; font-weight: 700; }

.shelf { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 260px); gap: 18px; overflow-x: auto; padding-bottom: 10px; scroll-snap-type: x mandatory; scrollbar-width: thin; scrollbar-color: var(--surface-3) transparent; }
.shelf > * { scroll-snap-align: start; }

/* ---------- Recipe cards ---------- */
.recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
.recipe-list { display: flex; flex-direction: column; gap: 12px; }
.recipe-card {
  position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; transition: transform .2s, border-color .2s, box-shadow .2s;
}
.recipe-card:hover { transform: translateY(-3px); border-color: var(--border-strong); box-shadow: var(--shadow); }
.card-link { display: flex; flex-direction: column; height: 100%; }
.card-media { aspect-ratio: 4 / 3; overflow: hidden; }
.card-media .recipe-img { width: 100%; height: 100%; transition: transform .4s; }
.recipe-card:hover .card-media .recipe-img { transform: scale(calc(var(--zoom, 1) * 1.05)); }
.card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.card-title { font-size: 1.02rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-desc { font-size: 0.86rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-tags { display: flex; gap: 10px; flex-wrap: wrap; }
.mini-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--text-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.card-meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 0.82rem; margin-top: auto; }
.card-meta span { display: inline-flex; align-items: center; gap: 5px; }
.rating-mini { color: var(--star) !important; }

.recipe-card.list .card-link { flex-direction: row; }
.recipe-card.list .card-media { width: 168px; aspect-ratio: auto; min-height: 120px; flex-shrink: 0; }
.recipe-card.list .card-body { padding-right: 60px; }

.fav-btn {
  position: absolute; top: 10px; right: 10px; width: 38px; height: 38px; border-radius: 50%;
  display: grid; place-items: center; border: 1px solid rgb(255 255 255 / 0.1);
  background: rgb(10 15 17 / 0.6); backdrop-filter: blur(8px); color: #fff; transition: transform .2s, color .2s;
}
.fav-btn:hover { transform: scale(1.1); }
.fav-btn.on { color: #ff6b8b; }
.fav-btn.on .icon { animation: pop .35s ease; }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }

.recipe-img { object-fit: cover; }
img.recipe-img { transform: scale(var(--zoom, 1)); }
.recipe-img.placeholder { display: grid; place-items: center; color: rgb(255 255 255 / 0.55); width: 100%; height: 100%; }
.placeholder-emoji { font-size: 3.6rem; filter: drop-shadow(0 8px 16px rgb(0 0 0 / 0.45)); }

/* ---------- Toolbar & filters ---------- */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.filter-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 16px; margin-bottom: 14px; animation: fade-in .2s ease; }
.filter-group { display: flex; flex-direction: column; gap: 8px; }
.filter-inline { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-end; border-top: 1px solid var(--border); padding-top: 16px; }
.active-filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.result-count { margin: 6px 0 16px; }

/* ---------- Cards, sections ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; }

/* ---------- Categories page ---------- */
.category-groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px; align-items: start; }
.group-title { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.category-list { list-style: none; margin: 0; padding: 0; }
.category-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--border); }
.category-row:first-child { border-top: 0; }
.category-main { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; padding: 4px; border-radius: 10px; }
.category-main:hover .category-name { color: var(--accent); }
.category-icon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; border: 1px solid; font-size: 1.05rem; flex-shrink: 0; }
.category-name { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-actions { display: flex; gap: 2px; }

.icon-picker, .color-picker { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.icon-choice { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-2); font-size: 1.1rem; }
.icon-choice.active { border-color: var(--accent); background: var(--surface-3); }
.icon-input { width: 70px !important; text-align: center; }
.swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; display: inline-block; flex-shrink: 0; }
button.swatch.active { border-color: #fff; box-shadow: 0 0 0 2px var(--bg-2) inset; }

/* ---------- Detail ---------- */
/* Bild oben fest, Textfeld-Rahmen fest – nur der Inhalt im Textfeld scrollt */
.page.detail {
  --hero-h: clamp(300px, 46vh, 520px); --overlap: 48px;
  position: fixed; top: 0; bottom: 0; left: var(--sidebar); right: 0; z-index: 1;
  max-width: none; margin: 0; display: flex; flex-direction: column;
}
.detail-hero { position: relative; flex: none; height: var(--hero-h); overflow: hidden; }
.detail-hero .recipe-img.hero-main { width: 100%; height: 100%; }
img.recipe-img.hero-main { display: block; }
.detail-hero .recipe-img.placeholder.hero-main { padding: 56px 0 var(--overlap); }
.detail-hero .placeholder-emoji { font-size: 8rem; }
.hero-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgb(8 12 13 / 0.45), transparent 35%, transparent 70%, rgb(8 12 13 / 0.4)); }
.hero-top { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; pointer-events: none; }
.hero-top > * { pointer-events: auto; }
.detail-sheet {
  position: relative; z-index: 1; flex: 1; min-height: 0; margin-top: calc(-1 * var(--overlap));
  display: flex; flex-direction: column; overflow: hidden;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(22px) saturate(1.2); -webkit-backdrop-filter: blur(22px) saturate(1.2);
  border-radius: 30px 30px 0 0; border: 1px solid rgb(255 255 255 / 0.12); border-bottom: 0;
  box-shadow: 0 -20px 40px -20px rgb(0 0 0 / 0.6);
}
.detail-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 30px clamp(16px, 4vw, 48px) 40px; scrollbar-width: thin; scrollbar-color: var(--surface-3) transparent; }
.detail-sheet .detail-content { max-width: 1240px; margin: 0 auto; }
.detail-title { display: flex; flex-direction: column; gap: 8px; }
.detail-title h1 { font-size: clamp(1.6rem, 4vw, 2.5rem); line-height: 1.15; }
.fav-big.on { color: #ff6b8b; }
.hero-tools { display: flex; gap: 8px; }
.icon-btn.glass:hover:not(:disabled) { background: rgb(10 15 17 / 0.75); color: #fff; }
.icon-btn.glass.danger:hover:not(:disabled) { color: var(--danger); }
.hero-add-image { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); background: rgb(10 15 17 / 0.55); backdrop-filter: blur(10px); color: #fff; border: 1px dashed rgb(255 255 255 / 0.35); }
.hero-add-image:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.hero-add-image:active:not(:disabled) { transform: translateX(-50%) scale(0.97); }
.hero-drop { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 10px; background: rgb(8 12 13 / 0.7); color: var(--accent); font-weight: 600; border: 2px dashed var(--accent); border-radius: inherit; pointer-events: none; }
.fav-big.pulse .icon { animation: pop .4s ease; }

.detail-content { display: flex; flex-direction: column; gap: 20px; }
.lead { font-size: 1.05rem; color: var(--text-2); max-width: 780px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.fact { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; align-items: center; }
.fact .icon { grid-row: span 2; color: var(--accent); }
.fact-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }

}

.modal { width: min(480px, 100%); min-width: 0; max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 22px; box-shadow: 0 30px 80px -20px #000; animation: modal-in .2s ease; }

/* ---------- Bildausschnitt-Editor ---------- */
.framer-box { position: relative; width: 100%; max-height: 52dvh; overflow: hidden; border-radius: 16px; background: #000; cursor: grab; touch-action: none; user-select: none; outline: none; }
.framer-box:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
.framer-box.dragging { cursor: grabbing; }
.framer-box img { display: block; width: 100%; height: 100%; pointer-events: none; }
.framer-grid { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .15s;
  background: linear-gradient(90deg, transparent calc(33.33% - .5px), rgb(255 255 255 / .45) calc(33.33% - .5px), rgb(255 255 255 / .45) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgb(255 255 255 / .45) calc(66.66% - .5px), rgb(255 255 255 / .45) calc(66.66% + .5px), transparent calc(66.66% + .5px)), linear-gradient(180deg, transparent calc(33.33% - .5px), rgb(255 255 255 / .45) calc(33.33% - .5px), rgb(255 255 255 / .45) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgb(255 255 255 / .45) calc(66.66% - .5px), rgb(255 255 255 / .45) calc(66.66% + .5px), transparent calc(66.66% + .5px)); }
.framer-box.dragging .framer-grid, .framer-box:hover .framer-grid { opacity: 1; }
.framer-covered { position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none; display: grid; place-items: center; background: repeating-linear-gradient(135deg, rgb(8 12 13 / .55) 0 8px, rgb(8 12 13 / .7) 8px 16px); border-top: 1px dashed rgb(255 255 255 / .35); }
.framer-covered span { font-size: .72rem; font-weight: 600; color: rgb(255 255 255 / .7); }
.framer-zoom { display: flex; align-items: center; gap: 10px; margin: 16px 0 8px; }

.framer-zoom-value { min-width: 48px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); font-weight: 600; font-size: .85rem; }

.toast-host { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: max-content; max-width: calc(100vw - 32px); }
.toast { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-radius: 14px; background: var(--surface-3); border: 1px solid var(--border-strong); box-shadow: var(--shadow); font-weight: 600; font-size: 0.9rem; animation: toast-in .25s ease; }

/* ---------- Cooking mode ---------- */
.cook-mode { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }

/* ---------- Feinschliff: Olive & Schwarz ---------- */

.logo-words { display: flex; flex-direction: column; line-height: 1; }

.sidebar { background: linear-gradient(180deg, #10150e, #0a0d09); border-right-color: var(--border); }
/* Seitenleiste: Gruppen, Icon-Kacheln, aktiver Eintrag mit olivgrüner Kachel und Markierung */

}

.btn { border-radius: 999px; padding: 11px 20px; }
.btn-sm { border-radius: 999px; padding: 7px 14px; }
.btn-lg { padding: 14px 26px; }
.btn-primary { border-color: transparent; background-clip: border-box; box-shadow: 0 12px 30px -16px var(--accent-glow), inset 0 1px 0 rgb(255 255 255 / .16); }
.btn-primary:hover:not(:disabled) { filter: brightness(1.05) saturate(1.05); }

.card, .recipe-card, .filter-panel, .fact, .featured { border-color: var(--border); }

input:not([type=checkbox]):not([type=file]):not([type=range]), select, textarea { border-radius: 14px; border-color: var(--border-strong); }
.stepper { border-radius: 999px; border-color: var(--border-strong); }

.detail-sheet { background: color-mix(in srgb, var(--bg) 90%, transparent); border-color: rgb(205 223 134 / .12); }
.modal { border-radius: 26px; border-color: var(--border-strong); background: linear-gradient(180deg, rgb(255 255 255 / .03), transparent 40%), var(--surface); }
.toast { border-radius: 999px; background: var(--surface-2); }
.form-footer { border-radius: 999px; background: color-mix(in srgb, var(--surface) 90%, transparent); }

/* ---------- Startseite (Web) ---------- */
.home-hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(340px, 0.9fr); gap: clamp(28px, 4vw, 56px); align-items: center; padding: 18px 0 8px; }

.quick-row { display: flex; flex-wrap: wrap; gap: 8px; }

  display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px;
  border: 1px solid var(--border-strong); background: rgb(255 255 255 / .025); color: var(--text-2);
  font-size: .86rem; font-weight: 600; transition: border-color .15s, color .15s, background .15s;
}

.stat-row { display: flex; margin: 10px 0 0; }
.stat { display: flex; flex-direction: column-reverse; gap: 4px; padding: 0 28px; border-left: 1px solid var(--border-strong); }

.stat dt { font-size: .8rem; color: var(--muted); }

.today-card {

<script type="text/babel" data-presets="react">
const { createContext, useContext, useEffect, useMemo, useRef, useState, useCallback } = React;
const { createPortal } = ReactDOM;
// ===== utils.js =====
// Hilfsfunktionen: IDs, Mengen, Zeiten, Speicher, Bilder

const uid = () =>
  Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);

const UNITS = ['g', 'kg', 'ml', 'l', 'TL', 'EL', 'Stück', 'Prise', 'Bund', 'Dose', 'Pck.', 'Tasse', 'Zehe', 'Scheibe', ''];

const FRACTION_UNITS = ['TL', 'EL', 'Stück', 'Prise', 'Bund', 'Dose', 'Pck.', 'Tasse', 'Zehe', 'Scheibe', ''];
const PIECE_UNITS = ['Stück', 'Bund', 'Dose', 'Pck.', 'Zehe', 'Scheibe'];

const DIFFICULTIES = ['leicht', 'mittel', 'anspruchsvoll'];

const capitalize = (s) => (s ? s[0].toUpperCase() + s.slice(1) : s);

const ALLERGENS = ['Gluten', 'Milch', 'Ei', 'Nüsse', 'Erdnüsse', 'Soja', 'Fisch', 'Krebstiere', 'Sellerie', 'Senf', 'Sesam'];

const CATEGORY_COLORS = ['#5fd3a3', '#b5e655', '#a3b65a', '#d0546e', '#f2a65a', '#f6d365', '#6cb8ff', '#a78bfa', '#f472b6', '#94a3b8'];

// "1,5" | "1/2" | "1 1/2" | "½" -> Zahl oder null
function parseAmount(text) {
  if (text === null || text === undefined) return null;
  let s = String(text).trim();
  if (!s) return null;
  const uni = { '¼': 0.25, '½': 0.5, '¾': 0.75, '⅓': 1 / 3, '⅔': 2 / 3 };
  let extra = 0;
  for (const [ch, val] of Object.entries(uni)) {
    if (s.includes(ch)) { extra += val; s = s.replace(ch, '').trim(); }
  }
  s = s.replace(',', '.');
  let value = 0;
  const mixed = s.match(/^(\d+)\s+(\d+)\/(\d+)$/);
  const frac = s.match(/^(\d+)\/(\d+)$/);
  if (mixed) value = Number(mixed[1]) + Number(mixed[2]) / Number(mixed[3]);
  else if (frac) value = Number(frac[1]) / Number(frac[2]);
  else if (s === '') value = 0;
  else value = Number(s);
  if (isNaN(value)) return null;
  const total = value + extra;
  return total > 0 ? total : null;
}

function formatDecimal(n) {
  return (Math.round(n * 100) / 100).toLocaleString('de-DE', { maximumFractionDigits: 2 });
}

function formatQty(a, unit) {
  if (!FRACTION_UNITS.includes(unit)) return formatDecimal(a);
  const whole = Math.floor(a);
  const rest = a - whole;
  const fractions = [[0.25, '¼'], [1 / 3, '⅓'], [0.5, '½'], [2 / 3, '⅔'], [0.75, '¾']];
  if (rest < 0.03) return String(whole);
  if (rest > 0.97) return String(whole + 1);
  const match = fractions.find(([v]) => Math.abs(v - rest) < 0.03);
  if (!match) return formatDecimal(a);
  return whole > 0 ? `${whole}${match[1]}` : match[1];
}

// Zahl + Einheit hübsch darstellen, optional g→kg / ml→l umrechnen
function prettyAmount(amount, unit = '', convert = true) {
  if (amount === null || amount === undefined || amount === '' || isNaN(amount)) return '';
  let a = Number(amount);
  let u = unit || '';
  if (convert) {
    if (u === 'g' && a >= 1000) { a /= 1000; u = 'kg'; }
    else if (u === 'ml' && a >= 1000) { a /= 1000; u = 'l'; }
    else if (u === 'kg' && a < 1) { a *= 1000; u = 'g'; }
    else if (u === 'l' && a < 1) { a *= 1000; u = 'ml'; }
  }
  if (u === 'g' || u === 'ml') a = a >= 100 ? Math.round(a / 5) * 5 : Math.round(a * 10) / 10;
  if (PIECE_UNITS.includes(u)) a = Math.max(0.5, Math.round(a * 4) / 4);
  return `${formatQty(a, u)}${u ? ' ' + u : ''}`;
}

function scaledAmount(ing, factor) {
  if (ing.amount === null || ing.amount === undefined || ing.amount === '') return null;
  return Number(ing.amount) * factor;
}

// Für Einkaufsliste: auf Basiseinheit (g / ml) bringen
function toBaseUnit(amount, unit) {
  if (amount === null) return { amount: null, unit };
  if (unit === 'kg') return { amount: amount * 1000, unit: 'g' };
  if (unit === 'l') return { amount: amount * 1000, unit: 'ml' };
  return { amount, unit };
}

function totalTime(r) {
  return (Number(r.prepTime) || 0) + (Number(r.cookTime) || 0);
}

function formatMinutes(min) {
  if (!min) return '–';
  if (min < 60) return `${min} Min.`;
  const h = Math.floor(min / 60);
  const m = min % 60;
  return m ? `${h} Std. ${m} Min.` : `${h} Std.`;
}

const normalize = (s) =>
  String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();

function levenshtein(a, b) {
  const dp = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) dp[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
  }
  return dp[a.length][b.length];
}

function isSimilarTitle(a, b) {
  const x = normalize(a);
  const y = normalize(b);
  if (x.length < 3 || y.length < 3) return false;
  if (x === y) return true;
  if (x.length >= 6 && y.length >= 6 && (x.includes(y) || y.includes(x))) return true;
  return levenshtein(x, y) <= Math.max(1, Math.floor(Math.min(x.length, y.length) / 8));
}

// "200 g Pasta" -> { amount, unit, name }
function parseIngredientLine(line) {
  const text = line.replace(/^[-•*\s]+/, '').trim();
  if (!text) return null;
  const m = text.match(/^([\d.,/½¼¾⅓⅔ ]+)?\s*([A-Za-zäöüÄÖÜ.]+)?\s*(.*)$/);
  if (!m) return { amount: null, unit: '', name: text };
  const amount = m[1] ? parseAmount(m[1].trim()) : null;
  const unitCandidate = (m[2] || '').trim();
  const unit = UNITS.find((u) => u && u.toLowerCase() === unitCandidate.toLowerCase());
  if (amount === null) return { amount: null, unit: '', name: text };
  if (unit) return { amount, unit, name: m[3].trim() || unitCandidate };
  return { amount, unit: 'Stück', name: `${unitCandidate} ${m[3]}`.trim() };
}

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch {
    return fallback;
  }
}

function saveJSON(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch {
    return false;
  }
}

// Bildausschnitt: Fokuspunkt in % und Zoom (1 = Bild füllt den Rahmen gerade aus)
const DEFAULT_FRAME = { x: 50, y: 50, zoom: 1 };

function frameStyle(frame) {
  const f = { ...DEFAULT_FRAME, ...frame };
  const pos = `${f.x}% ${f.y}%`;
  return { objectPosition: pos, transformOrigin: pos, '--zoom': f.zoom };
}

// Bild verkleinern, damit es in den lokalen Speicher passt
function resizeImage(file, max = 1100) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function downloadFile(filename, content, type = 'application/json') {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function recipeToText(recipe, categories) {
  const cats = recipe.categoryIds.map((id) => categories.find((c) => c.id === id)?.name).filter(Boolean);
  const lines = [
    recipe.title.toUpperCase(),
    recipe.description || '',
    cats.length ? `Kategorien: ${cats.join(', ')}` : '',
    `Portionen: ${recipe.servings} · Zeit: ${formatMinutes(totalTime(recipe))}`,
    '',
    'ZUTATEN',
    ...recipe.ingredients.map((i) => `• ${prettyAmount(i.amount, i.unit)} ${i.name}`.replace('•  ', '• ')),
    '',
    'ZUBEREITUNG',
    ...recipe.steps.map((s, i) => `${i + 1}. ${s}`),
  ];
  if (recipe.notes) lines.push('', 'NOTIZEN', recipe.notes);
  lines.push('', '— geteilt aus iCook');
  return lines.filter((l, i, arr) => !(l === '' && arr[i - 1] === '')).join('\n');
}

// ===== store.jsx =====



// Alle Daten liegen ausschließlich lokal im Browser (localStorage) – kein Backend.
const KEYS = {
  recipes: 'icook.recipes',
  categories: 'icook.categories',
  shopping: 'icook.shopping',
  settings: 'icook.settings',
};

const DEFAULT_SETTINGS = {
  accent: 'olive',
  view: 'grid',
  convertUnits: true,
  keepAwake: true,
};

const StoreContext = createContext(null);

function usePersistent(key, initial, onError) {
  const [value, setValue] = useState(() => loadJSON(key, initial));
  const first = useRef(true);
  useEffect(() => {
    if (first.current) { first.current = false; return; }
    if (!saveJSON(key, value)) onError?.();
  }, [key, value]);
  return [value, setValue];
}

function StoreProvider({ children }) {
  const [toasts, setToasts] = useState([]);

  const toast = useCallback((message, type = 'success') => {
    const id = uid();
    setToasts((t) => [...t, { id, message, type }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 2800);
  }, []);

  const storageError = () => toast('Speicher voll – bitte große Bilder entfernen oder Daten exportieren.', 'error');

  const [recipes, setRecipes] = usePersistent(KEYS.recipes, sampleRecipes, storageError);
  const [categories, setCategories] = usePersistent(KEYS.categories, sampleCategories, storageError);
  const [shopping, setShopping] = usePersistent(KEYS.shopping, [], storageError);
  const [storedSettings, setSettings] = usePersistent(KEYS.settings, DEFAULT_SETTINGS, storageError);
  const settings = { ...DEFAULT_SETTINGS, ...storedSettings };

  // ---------- Rezepte ----------
  const addRecipe = (data) => {
    const id = uid();
    setRecipes((rs) => [{ ...data, id, favorite: false, rating: 0, createdAt: Date.now(), lastUsedAt: null }, ...rs]);
    return id;
  };

  const updateRecipe = (id, patch) =>
    setRecipes((rs) => rs.map((r) => (r.id === id ? { ...r, ...patch } : r)));

  const deleteRecipe = (id) => setRecipes((rs) => rs.filter((r) => r.id !== id));

  const duplicateRecipe = (id) => {
    const original = recipes.find((r) => r.id === id);
    if (!original) return null;
    const newId = uid();
    const copy = {
      ...original,
      id: newId,
      title: `${original.title} (Kopie)`,
      favorite: false,
      createdAt: Date.now(),
      lastUsedAt: null,
      ingredients: original.ingredients.map((i) => ({ ...i, id: uid() })),
    };
    setRecipes((rs) => [copy, ...rs]);
    return newId;
  };

  const toggleFavorite = (id) =>
    setRecipes((rs) => rs.map((r) => (r.id === id ? { ...r, favorite: !r.favorite } : r)));

  const markUsed = (id) => updateRecipe(id, { lastUsedAt: Date.now() });

  // ---------- Kategorien ----------
  const addCategory = ({ name, group = 'Eigene', icon = '🏷️', color = '#5fd3a3' }) => {
    const id = uid();
    setCategories((cs) => [...cs, { id, name: name.trim(), group, icon, color }]);
    return id;
  };

  const updateCategory = (id, patch) =>
    setCategories((cs) => cs.map((c) => (c.id === id ? { ...c, ...patch } : c)));

  const deleteCategory = (id) => {
    setCategories((cs) => cs.filter((c) => c.id !== id));
    setRecipes((rs) => rs.map((r) => ({ ...r, categoryIds: r.categoryIds.filter((c) => c !== id) })));
  };

  // innerhalb derselben Gruppe nach oben (-1) oder unten (+1) verschieben
  const moveCategory = (id, dir) =>
    setCategories((cs) => {
      const idx = cs.findIndex((c) => c.id === id);
      const group = cs[idx].group;
      let j = idx + dir;
      while (j >= 0 && j < cs.length && cs[j].group !== group) j += dir;
      if (j < 0 || j >= cs.length) return cs;
      const next = [...cs];
      [next[idx], next[j]] = [next[j], next[idx]];
      return next;
    });

  // ---------- Einkaufsliste ----------
  // selections: [{ recipe, servings }]
  const addRecipesToShopping = (selections) => {
    setShopping((list) => {
      const next = list.map((i) => ({ ...i, sources: [...i.sources] }));
      selections.forEach(({ recipe, servings }) => {
        const factor = servings / recipe.servings;
        recipe.ingredients.forEach((ing) => {
          const { amount, unit } = toBaseUnit(scaledAmount(ing, factor), ing.unit);
          const key = `${normalize(ing.name)}|${amount === null ? '' : unit}`;
          const existing = next.find((i) => !i.checked && i.key === key);
          if (existing) {
            if (existing.amount !== null && amount !== null) existing.amount += amount;
            if (!existing.sources.includes(recipe.title)) existing.sources.push(recipe.title);
          } else {
            next.push({ id: uid(), key, name: ing.name, amount, unit: amount === null ? '' : unit, checked: false, sources: [recipe.title] });
          }
        });
      });
      return next;
    });
  };

  const addShoppingItem = (name) =>
    setShopping((list) => [...list, { id: uid(), key: `manual|${uid()}`, name, amount: null, unit: '', checked: false, sources: [] }]);

  const toggleShoppingItem = (id) =>
    setShopping((list) => list.map((i) => (i.id === id ? { ...i, checked: !i.checked } : i)));

  const removeShoppingItem = (id) => setShopping((list) => list.filter((i) => i.id !== id));
  const clearCheckedShopping = () => setShopping((list) => list.filter((i) => !i.checked));
  const clearShopping = () => setShopping([]);

  // ---------- Einstellungen & Datensicherung ----------
  const updateSettings = (patch) => setSettings((s) => ({ ...DEFAULT_SETTINGS, ...s, ...patch }));

  const exportData = () => ({
    app: 'iCook',
    version: 1,
    exportedAt: new Date().toISOString(),
    recipes,
    categories,
    shopping,
  });

  const importData = (data) => {
    if (!data || !Array.isArray(data.recipes) || !Array.isArray(data.categories)) {
      throw new Error('Ungültige Datei');
    }
    setRecipes(data.recipes);
    setCategories(data.categories);
    setShopping(Array.isArray(data.shopping) ? data.shopping : []);
  };

  const resetToSamples = () => {
    setRecipes(sampleRecipes);
    setCategories(sampleCategories);
    setShopping([]);
  };

  const clearAll = () => {
    setRecipes([]);
    setCategories([]);
    setShopping([]);
  };

  const value = {
    recipes, categories, shopping, settings, toasts,
    toast,
    addRecipe, updateRecipe, deleteRecipe, duplicateRecipe, toggleFavorite, markUsed,
    addCategory, updateCategory, deleteCategory, moveCategory,
    addRecipesToShopping, addShoppingItem, toggleShoppingItem, removeShoppingItem, clearCheckedShopping, clearShopping,
    updateSettings, exportData, importData, resetToSamples, clearAll,
  };

  return <StoreContext.Provider value={value}>{children}</StoreContext.Provider>;
}

function useStore() {
  return useContext(StoreContext);
}

// Minimaler Hash-Router (#/pfad?query) – funktioniert ohne Server-Konfiguration.

function readLocation() {
  const raw = window.location.hash.replace(/^#/, '') || '/';
  const [path, qs = ''] = raw.split('?');
  return { path: path || '/', query: new URLSearchParams(qs), raw };
}

let navigationBlocker = null;
let lastHash = window.location.hash;
// Besuchte Pfade dieser Sitzung – für einen sinnvollen „Zurück“-Pfeil
const visited = [readLocation().raw];

// Letzte besuchte Seite außerhalb von `prefix` (z. B. alles außer diesem Rezept und seinem Kochmodus)
function lastPathOutside(prefix, fallback = '/') {
  for (let i = visited.length - 1; i >= 0; i--) {
    const path = visited[i].split('?')[0];
    if (path !== prefix && !path.startsWith(prefix + '/')) return visited[i];
  }
  return fallback;
}

function previousPath() {
  return visited.length > 1 ? visited[visited.length - 2].split('?')[0] : null;
}

// Formular kann Navigation abfangen, wenn ungespeicherte Änderungen vorliegen
function setNavigationBlocker(fn) {
  navigationBlocker = fn;
}

function navigate(to, { replace = false } = {}) {
  if (replace) {
    history.replaceState(null, '', '#' + to);
    window.dispatchEvent(new HashChangeEvent('hashchange'));
  } else {
    window.location.hash = to;
  }
}

function useLocation() {
  const [loc, setLoc] = useState(readLocation);
  useEffect(() => {
    const onChange = () => {
      if (navigationBlocker && navigationBlocker()) {
        const ok = window.confirm('Du hast ungespeicherte Änderungen. Seite wirklich verlassen?');
        if (!ok) {
          history.replaceState(null, '', lastHash || '#/');
          return;
        }
        navigationBlocker = null;
      }
      lastHash = window.location.hash;
      const next = readLocation();
      visited.push(next.raw);
      setLoc(next);
      window.scrollTo({ top: 0 });
    };
    window.addEventListener('hashchange', onChange);
    return () => window.removeEventListener('hashchange', onChange);
  }, []);
  return loc;
}

function Link({ to, children, className, ...rest }) {
  return (
    <a href={'#' + to} className={className} {...rest}>
      {children}
    </a>
  );
}

// "/rezept/:id" gegen Pfad prüfen -> Parameter oder null
function matchRoute(pattern, path) {
  const p = pattern.split('/').filter(Boolean);
  const s = path.split('/').filter(Boolean);
  if (p.length !== s.length) return null;
  const params = {};
  for (let i = 0; i < p.length; i++) {
    if (p[i].startsWith(':')) params[p[i].slice(1)] = decodeURIComponent(s[i]);
    else if (p[i] !== s[i]) return null;
  }
  return params;
}

function Modal({ title, onClose, children, footer, wide = false }) {
  useEffect(() => {
    const onKey = (e) => e.key === 'Escape' && onClose();
    document.addEventListener('keydown', onKey);
    document.body.classList.add('no-scroll');
    return () => {
      document.removeEventListener('keydown', onKey);
      document.body.classList.remove('no-scroll');
    };
  }, [onClose]);

  return createPortal(
    <div className="modal-backdrop" onMouseDown={(e) => e.target === e.currentTarget && onClose()}>
      <div className={`modal ${wide ? 'modal-wide' : ''}`} role="dialog" aria-modal="true" aria-label={title}>
        <div className="modal-head">
          <h2>{title}</h2>
          <button className="icon-btn" onClick={onClose} aria-label="Schließen">
            <Icon name="x" />
          </button>
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot">{footer}</div>}
      </div>
    </div>,
    document.body
  );
}

const MIN_ZOOM = 1;
const MAX_ZOOM = 4;
const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

// Bildausschnitt wählen: ziehen zum Verschieben, Regler/Mausrad/zwei Finger zum Zoomen.
// Gespeichert wird nur ein Fokuspunkt (x/y in %) und der Zoom – so passt der Ausschnitt
// auf breiten wie auf schmalen Bildschirmen.
function ImageFramer({ src, initial, aspect = 2.4, coverBottom = 0, title = 'Bildausschnitt anpassen', onSave, onCancel }) {
  const [frame, setFrame] = useState({ ...DEFAULT_FRAME, ...initial });
  const [dragging, setDragging] = useState(false);
  const boxRef = useRef(null);
  const natural = useRef(null);
  const pointers = useRef(new Map());
  const pinch = useRef(null);

  // Verschiebung in Pixeln -> neue Fokus-Position. Exakt für object-fit: cover + scale um den Fokuspunkt.
  const shift = (f, dx, dy) => {
    const box = boxRef.current;
    if (!box || !natural.current) return f;
    const W = box.clientWidth;
    const H = box.clientHeight;
    const s = Math.max(W / natural.current.w, H / natural.current.h);
    const spanX = W - natural.current.w * s * f.zoom;
    const spanY = H - natural.current.h * s * f.zoom;
    return {
      ...f,
      x: spanX < -0.5 ? clamp(f.x + (dx * 100) / spanX, 0, 100) : f.x,
      y: spanY < -0.5 ? clamp(f.y + (dy * 100) / spanY, 0, 100) : f.y,
    };
  };

  const zoomTo = (z) => setFrame((f) => ({ ...f, zoom: clamp(z, MIN_ZOOM, MAX_ZOOM) }));

  useEffect(() => {
    const box = boxRef.current;
    const onWheel = (e) => {
      e.preventDefault();
      setFrame((f) => ({ ...f, zoom: clamp(f.zoom * Math.exp(-e.deltaY * 0.0015), MIN_ZOOM, MAX_ZOOM) }));
    };
    box.addEventListener('wheel', onWheel, { passive: false });
    return () => box.removeEventListener('wheel', onWheel);
  }, []);

  const onPointerDown = (e) => {
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch { /* Zeiger schon beendet */ }
    pointers.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
    setDragging(true);
    if (pointers.current.size === 2) {
      const [a, b] = [...pointers.current.values()];
      pinch.current = { dist: Math.hypot(a.x - b.x, a.y - b.y), zoom: frame.zoom };
    }
  };

  const onPointerMove = (e) => {
    const prev = pointers.current.get(e.pointerId);
    if (!prev) return;
    const next = { x: e.clientX, y: e.clientY };
    pointers.current.set(e.pointerId, next);
    if (pointers.current.size === 2 && pinch.current) {
      const [a, b] = [...pointers.current.values()];
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      zoomTo((pinch.current.zoom * dist) / pinch.current.dist);
    } else if (pointers.current.size === 1) {
      setFrame((f) => shift(f, next.x - prev.x, next.y - prev.y));
    }
  };

  const onPointerUp = (e) => {
    pointers.current.delete(e.pointerId);
    if (pointers.current.size < 2) pinch.current = null;
    if (!pointers.current.size) setDragging(false);
  };

  const onKeyDown = (e) => {
    const step = e.shiftKey ? 40 : 10;
    const moves = { ArrowLeft: [step, 0], ArrowRight: [-step, 0], ArrowUp: [0, step], ArrowDown: [0, -step] };
    if (moves[e.key]) {
      e.preventDefault();
      setFrame((f) => shift(f, ...moves[e.key]));
    } else if (e.key === '+' || e.key === '=') {
      zoomTo(frame.zoom + 0.1);
    } else if (e.key === '-') {
      zoomTo(frame.zoom - 0.1);
    }
  };

  return (
    <Modal
      title={title}
      onClose={onCancel}
      wide
      footer={
        <>
          <button className="btn btn-ghost" onClick={onCancel}>Abbrechen</button>
          <button className="btn btn-primary" onClick={() => onSave(frame)}>
            <Icon name="check" size={17} /> Übernehmen
          </button>
        </>
      }
    >
      <div
        ref={boxRef}
        className={`framer-box ${dragging ? 'dragging' : ''}`}
        style={{ aspectRatio: aspect }}
        tabIndex={0}
        aria-label="Bildausschnitt. Mit den Pfeiltasten verschieben, mit Plus und Minus zoomen."
        onPointerDown={onPointerDown}
        onPointerMove={onPointerMove}
        onPointerUp={onPointerUp}
        onPointerCancel={onPointerUp}
        onKeyDown={onKeyDown}
      >
        <img
          className="recipe-img"
          src={src}
          alt=""
          draggable={false}
          style={frameStyle(frame)}
          onLoad={(e) => { natural.current = { w: e.currentTarget.naturalWidth, h: e.currentTarget.naturalHeight }; }}
        />
        <div className="framer-grid" />
        {coverBottom > 0 && <div className="framer-covered" style={{ height: `${coverBottom * 100}%` }}><span>vom Textfeld verdeckt</span></div>}
      </div>

      <div className="framer-zoom">
        <button type="button" className="icon-btn sm" onClick={() => zoomTo(frame.zoom - 0.2)} disabled={frame.zoom <= MIN_ZOOM} aria-label="Verkleinern">
          <Icon name="minus" size={16} />
        </button>
        <input
          type="range"
          min={MIN_ZOOM}
          max={MAX_ZOOM}
          step={0.01}
          value={frame.zoom}
          onChange={(e) => zoomTo(Number(e.target.value))}
          aria-label="Zoom"
        />
        <button type="button" className="icon-btn sm" onClick={() => zoomTo(frame.zoom + 0.2)} disabled={frame.zoom >= MAX_ZOOM} aria-label="Vergrößern">
          <Icon name="plus" size={16} />
        </button>
        <span className="framer-zoom-value">{Math.round(frame.zoom * 100)} %</span>
        <button type="button" className="icon-btn sm" onClick={() => setFrame(DEFAULT_FRAME)} aria-label="Ausschnitt zurücksetzen" title="Zurücksetzen">
          <Icon name="refresh" size={16} />
        </button>
      </div>
      <p className="muted small">Bild ziehen zum Verschieben · Regler, Mausrad oder zwei Finger zum Zoomen</p>
    </Modal>
  );
}

function RecipeCard({ recipe, layout = 'grid' }) {
  const { categories, toggleFavorite } = useStore();
  const cats = recipe.categoryIds
    .map((id) => categories.find((c) => c.id === id))
    .filter(Boolean)
    .slice(0, layout === 'list' ? 4 : 2);

  return (
    <article className={`recipe-card ${layout}`}>
      <Link to={`/rezept/${recipe.id}`} className="card-link" aria-label={recipe.title}>
        <div className="card-media">
          <RecipeImage recipe={recipe} />
          <div className="card-badges">
            <span className="card-badge"><Icon name="clock" size={13} /> {formatMinutes(totalTime(recipe))}</span>
            {recipe.difficulty && <span className="card-badge">{capitalize(recipe.difficulty)}</span>}
          </div>
        </div>
        <div className="card-body">
          <h3 className="card-title">{recipe.title}</h3>
          {layout === 'list' && recipe.description && <p className="card-desc muted">{recipe.description}</p>}
          <div className="card-tags">
            {cats.map((c) => (
              <span key={c.id} className="mini-tag">
                <span className="dot" style={{ background: c.color }} />
                {c.name}
              </span>
            ))}
          </div>
          <div className="card-meta">
            <span><Icon name="users" size={15} /> {recipe.servings} {recipe.servings === 1 ? 'Portion' : 'Portionen'}</span>
            {recipe.rating > 0 && (
              <span className="rating-mini"><Icon name="star" size={14} filled /> {recipe.rating}</span>
            )}
          </div>
        </div>
      </Link>
      <button
        className={`fav-btn ${recipe.favorite ? 'on' : ''}`}
        onClick={() => toggleFavorite(recipe.id)}
        aria-label={recipe.favorite ? 'Aus Favoriten entfernen' : 'Zu Favoriten hinzufügen'}
        aria-pressed={recipe.favorite}
      >
        <Icon name="heart" size={18} filled={recipe.favorite} />
      </button>
    </article>
  );
}

const ICON_SUGGESTIONS = ['🏷️', '🍝', '🍲', '🥗', '🍛', '🍰', '🍳', '🥩', '🐟', '🥕', '🌱', '🔥', '⚡', '🥂', '👵', '🏖️', '🎄', '📦', '🌶️', '🧀'];

// Dialog zum Anlegen oder Bearbeiten einer Kategorie
function CategoryEditor({ category, onClose, onSaved }) {
  const { categories, addCategory, updateCategory, toast } = useStore();
  const [name, setName] = useState(category?.name || '');
  const [icon, setIcon] = useState(category?.icon || '🏷️');
  const [color, setColor] = useState(category?.color || CATEGORY_COLORS[0]);
  const [group, setGroup] = useState(category?.group || 'Eigene');
  const [error, setError] = useState('');

  const groups = Array.from(new Set([...CATEGORY_GROUPS, ...categories.map((c) => c.group)]));

  const save = (e) => {
    e.preventDefault();
    e.stopPropagation();
    const trimmed = name.trim();
    if (!trimmed) return setError('Bitte gib einen Namen ein.');
    const clash = categories.find((c) => c.name.toLowerCase() === trimmed.toLowerCase() && c.id !== category?.id);
    if (clash) return setError('Eine Kategorie mit diesem Namen gibt es bereits.');
    if (category) {
      updateCategory(category.id, { name: trimmed, icon, color, group });
      toast('Kategorie gespeichert');
      onSaved?.(category.id);
    } else {
      const id = addCategory({ name: trimmed, icon, color, group });
      toast(`Kategorie „${trimmed}“ erstellt`);
      onSaved?.(id);
    }
    onClose();
  };

  return (
    <Modal
      title={category ? 'Kategorie bearbeiten' : 'Neue Kategorie'}
      onClose={onClose}
      footer={
        <>
          <button type="button" className="btn btn-ghost" onClick={onClose}>Abbrechen</button>
          <button type="submit" form="category-form" className="btn btn-primary">Speichern</button>
        </>
      }
    >
      <form id="category-form" onSubmit={save} className="form-stack">
        <label className="field">
          <span className="label">Name *</span>
          <input
            autoFocus
            value={name}
            onChange={(e) => { setName(e.target.value); setError(''); }}
            placeholder="z. B. Rezepte für den Sommer"
            aria-invalid={!!error}
          />
          {error && <span className="field-error">{error}</span>}
        </label>

        <label className="field">
          <span className="label">Gruppe</span>
          <select value={group} onChange={(e) => setGroup(e.target.value)}>
            {groups.map((g) => <option key={g} value={g}>{g}</option>)}
          </select>
        </label>

        <div className="field">
          <span className="label">Symbol</span>
          <div className="icon-picker">
            {ICON_SUGGESTIONS.map((ic) => (
              <button type="button" key={ic} className={`icon-choice ${ic === icon ? 'active' : ''}`} onClick={() => setIcon(ic)}>
                {ic}
              </button>
            ))}
            <input
              className="icon-input"
              value={icon}
              maxLength={4}
              onChange={(e) => setIcon(e.target.value)}
              aria-label="Eigenes Emoji"
            />
          </div>
        </div>

        <div className="field">
          <span className="label">Farbe</span>
          <div className="color-picker">
            {CATEGORY_COLORS.map((c) => (
              <button
                type="button"
                key={c}
                className={`swatch ${c === color ? 'active' : ''}`}
                style={{ background: c }}
                onClick={() => setColor(c)}
                aria-label={`Farbe ${c}`}
              />
            ))}
          </div>
        </div>

        <div className="field">
          <span className="label">Vorschau</span>
          <div>
            <span className="chip active" style={{ '--chip-color': color }}>
              <span className="chip-icon">{icon}</span>{name || 'Kategoriename'}
            </span>
          </div>
        </div>
      </form>
    </Modal>
  );
}

function Shelf({ title, subtitle, link, recipes }) {

// Jeden Tag ein anderes Rezept – innerhalb eines Tages stabil
function recipeOfTheDay(recipes) {
  if (!recipes.length) return null;
  const sorted = [...recipes].sort((a, b) => a.id.localeCompare(b.id));
  return sorted[Math.floor(Date.now() / MS_PER_DAY) % sorted.length];
}

// ===== pages/RecipesPage.jsx =====







const TIME_FILTERS = [
  { value: 0, label: 'Egal' },
  { value: 15, label: '≤ 15 Min.' },
  { value: 30, label: '≤ 30 Min.' },
  { value: 60, label: '≤ 60 Min.' },
];

const SORTS = [
  { value: 'new', label: 'Zuletzt hinzugefügt' },
  { value: 'alpha', label: 'Alphabetisch (A–Z)' },
  { value: 'used', label: 'Zuletzt verwendet' },
  { value: 'time', label: 'Schnellste zuerst' },
  { value: 'rating', label: 'Beste Bewertung' },
];

function RecipesPage({ query, favoritesOnly = false }) {
  const { recipes, categories, settings, updateSettings } = useStore();

  const [q, setQ] = useState(query.get('q') || '');
  const [mode, setMode] = useState('title'); // title | ingredients
  const [selected, setSelected] = useState(query.get('kat') ? query.get('kat').split(',') : []);
  const [maxTime, setMaxTime] = useState(Number(query.get('zeit')) || 0);
  const [difficulty, setDifficulty] = useState('');
  const [onlyFav, setOnlyFav] = useState(favoritesOnly || query.get('fav') === '1');
  const [sort, setSort] = useState(query.get('sort') || 'new');
  const [showFilters, setShowFilters] = useState(false);

  // Wenn sich die URL (z. B. über die Startseite) ändert, Filter übernehmen
  const qs = query.toString();
  useEffect(() => {
    setQ(query.get('q') || '');
    setSelected(query.get('kat') ? query.get('kat').split(',') : []);
    if (query.get('sort')) setSort(query.get('sort'));
    if (query.get('zeit')) setMaxTime(Number(query.get('zeit')) || 0);
  }, [qs]);

  const groups = useMemo(() => {
    const map = new Map();
    categories.forEach((c) => {
      if (!map.has(c.group)) map.set(c.group, []);
      map.get(c.group).push(c);
    });
    return [...map.entries()];
  }, [categories]);

  const results = useMemo(() => {
    const terms = mode === 'ingredients'
      ? q.split(/[,;]+/).map(normalize).filter(Boolean)
      : [normalize(q)].filter(Boolean);

    let list = recipes.filter((r) => {
      if (onlyFav && !r.favorite) return false;
      if (selected.length && !selected.every((id) => r.categoryIds.includes(id))) return false;
      if (maxTime && (totalTime(r) === 0 || totalTime(r) > maxTime)) return false;
      if (difficulty && r.difficulty !== difficulty) return false;
      if (!terms.length) return true;
      if (mode === 'ingredients') {
        const names = r.ingredients.map((i) => normalize(i.name));
        return terms.every((t) => names.some((n) => n.includes(t)));
      }
      const catNames = r.categoryIds.map((id) => categories.find((c) => c.id === id)?.name || '').join(' ');
      const haystack = normalize(`${r.title} ${r.description} ${catNames}`);
      return terms.every((t) => haystack.includes(t));
    });

    const sorters = {
      new: (a, b) => b.createdAt - a.createdAt,
      alpha: (a, b) => a.title.localeCompare(b.title, 'de'),
      used: (a, b) => (b.lastUsedAt || 0) - (a.lastUsedAt || 0),
      time: (a, b) => (totalTime(a) || 999) - (totalTime(b) || 999),
      rating: (a, b) => (b.rating || 0) - (a.rating || 0),
    };
    return [...list].sort(sorters[sort] || sorters.new);
  }, [recipes, categories, q, mode, selected, maxTime, difficulty, onlyFav, sort]);

  const toggleCategory = (id) =>
    setSelected((s) => (s.includes(id) ? s.filter((x) => x !== id) : [...s, id]));

  const activeFilterCount = selected.length + (maxTime ? 1 : 0) + (difficulty ? 1 : 0) + (onlyFav && !favoritesOnly ? 1 : 0);

  const reset = () => {
    setQ(''); setSelected([]); setMaxTime(0); setDifficulty('');
    if (!favoritesOnly) setOnlyFav(false);
  };

  const surprise = () => {
    if (!results.length) return;
    navigate(`/rezept/${results[Math.floor(Math.random() * results.length)].id}`);
  };

  const view = settings.view;

  return (
    <div className="page">
      <PageHeader
        title={favoritesOnly ? 'Favoriten' : 'Alle Rezepte'}
        subtitle={favoritesOnly ? 'Deine Lieblingsgerichte für den schnellen Zugriff.' : 'Durchsuche und filtere deine Sammlung.'}
        actions={
          <button className="btn btn-outline" onClick={surprise} disabled={!results.length}>
            <Icon name="shuffle" size={17} /> Überrasch mich
          </button>
        }
      />

      <div className="toolbar">
        <div className="search-bar">
          <Icon name="search" />
          <input
            value={q}
            onChange={(e) => setQ(e.target.value)}
            placeholder={mode === 'ingredients' ? 'Zutaten, mit Komma getrennt: Eier, Tomaten …' : 'Titel, Beschreibung oder Kategorie …'}
            aria-label="Suche"
          />
          {q && (
            <button className="icon-btn sm" onClick={() => setQ('')} aria-label="Suche leeren"><Icon name="x" size={16} /></button>
          )}
        </div>
        <div className="segmented" role="group" aria-label="Suchmodus">
          <button className={mode === 'title' ? 'active' : ''} onClick={() => setMode('title')}>Rezepte</button>
          <button className={mode === 'ingredients' ? 'active' : ''} onClick={() => setMode('ingredients')}>Ich habe …</button>
        </div>
        <button className={`btn btn-outline ${showFilters ? 'is-on' : ''}`} onClick={() => setShowFilters((s) => !s)} aria-expanded={showFilters}>
          <Icon name="filter" size={16} /> Filter {activeFilterCount > 0 && <span className="badge inline">{activeFilterCount}</span>}
        </button>
        <select className="select-sm" value={sort} onChange={(e) => setSort(e.target.value)} aria-label="Sortierung">
          {SORTS.map((s) => <option key={s.value} value={s.value}>{s.label}</option>)}
        </select>
        <div className="segmented" role="group" aria-label="Ansicht">
          <button className={view === 'grid' ? 'active' : ''} onClick={() => updateSettings({ view: 'grid' })} aria-label="Kartenansicht"><Icon name="grid" size={17} /></button>
          <button className={view === 'list' ? 'active' : ''} onClick={() => updateSettings({ view: 'list' })} aria-label="Listenansicht"><Icon name="list" size={17} /></button>
        </div>
      </div>

      {showFilters && (
        <div className="filter-panel">
          {groups.map(([group, cats]) => (
            <div key={group} className="filter-group">
              <span className="label">{group}</span>
              <div className="chip-row wrap">
                {cats.map((c) => (
                  <CategoryTag key={c.id} category={c} small active={selected.includes(c.id)} onClick={() => toggleCategory(c.id)} />
                ))}
              </div>
            </div>
          ))}
          <div className="filter-inline">
            <div className="filter-group">
              <span className="label">Gesamtzeit</span>
              <div className="segmented">
                {TIME_FILTERS.map((t) => (
                  <button key={t.value} className={maxTime === t.value ? 'active' : ''} onClick={() => setMaxTime(t.value)}>{t.label}</button>
                ))}
              </div>
            </div>
            <div className="filter-group">
              <span className="label">Schwierigkeit</span>
              <div className="segmented">
                <button className={!difficulty ? 'active' : ''} onClick={() => setDifficulty('')}>Alle</button>
                {DIFFICULTIES.map((d) => (
                  <button key={d} className={difficulty === d ? 'active' : ''} onClick={() => setDifficulty(d)}>{capitalize(d)}</button>
                ))}
              </div>
            </div>
            {!favoritesOnly && (
              <label className="toggle">
                <input type="checkbox" checked={onlyFav} onChange={(e) => setOnlyFav(e.target.checked)} />
                <span className="toggle-ui" /> Nur Favoriten
              </label>
            )}
          </div>
        </div>
      )}

      {selected.length > 0 && (
        <div className="active-filters">
          <span className="muted small">Gefiltert nach:</span>
          {selected.map((id) => {
            const c = categories.find((x) => x.id === id);
            return c ? (
              <button key={id} className="chip chip-sm active removable" style={{ '--chip-color': c.color }} onClick={() => toggleCategory(id)}>
                {c.icon} {c.name} <Icon name="x" size={13} />
              </button>
            ) : null;
          })}
        </div>
      )}

      <p className="result-count muted small" aria-live="polite">
        {results.length} {results.length === 1 ? 'Rezept' : 'Rezepte'} gefunden
        {(q || activeFilterCount > 0) && (
          <button className="link-btn" onClick={reset}>Filter zurücksetzen</button>
        )}
      </p>

      {results.length ? (
        <div className={view === 'list' ? 'recipe-list' : 'recipe-grid'}>
          {results.map((r) => <RecipeCard key={r.id} recipe={r} layout={view} />)}
        </div>
      ) : favoritesOnly && !recipes.some((r) => r.favorite) ? (
        <EmptyState
          icon="heart"
          title="Noch keine Favoriten"
          text="Tippe auf das Herz bei einem Rezept, um es hier zu sammeln."
          action={<Link to="/rezepte" className="btn btn-primary">Rezepte entdecken</Link>}
        />
      ) : (
        <EmptyState
          icon="search"
          title="Keine passenden Rezepte"
          text="Versuche einen anderen Suchbegriff oder entferne Filter."
          action={<button className="btn btn-outline" onClick={reset}>Filter zurücksetzen</button>}
        />
      )}
    </div>
  );
}

    categories.forEach((c) => {
      if (!map.has(c.group)) map.set(c.group, []);
      map.get(c.group).push(c);
    });
    return [...map.entries()];
  }, [categories]);

  const confirmDelete = () => {
    deleteCategory(deleting.id);
    toast(`Kategorie „${deleting.name}“ gelöscht`);
    setDeleting(null);
  };

  return (
    <div className="page">
      <PageHeader
        title="Kategorien"
        subtitle="Deine persönliche Ordnung – erstellen, umbenennen, sortieren oder löschen."
        actions={
          <button className="btn btn-primary" onClick={() => setEditing('new')}>
            <Icon name="plus" size={18} /> Neue Kategorie
          </button>
        }
      />

      {!categories.length && (
        <EmptyState icon="tag" title="Noch keine Kategorien" text="Lege z. B. „Gerichte wie bei Oma“ oder „Schnell & einfach“ an." />
      )}

      <div className="category-groups">
        {groups.map(([group, cats]) => (
          <section key={group} className="card category-group">
            <h2 className="group-title">{group} <span className="muted small">{cats.length}</span></h2>
            <ul className="category-list">
              {cats.map((c, idx) => (
                <li key={c.id} className="category-row">
                  <Link to={`/rezepte?kat=${c.id}`} className="category-main">
                    <span className="category-icon" style={{ background: `${c.color}22`, borderColor: `${c.color}66` }}>{c.icon}</span>
                    <span className="category-name">{c.name}</span>
                    <span className="muted small">{counts[c.id] || 0} {counts[c.id] === 1 ? 'Rezept' : 'Rezepte'}</span>
                  </Link>
                  <div className="row-actions">
                    <button className="icon-btn sm" onClick={() => moveCategory(c.id, -1)} disabled={idx === 0} aria-label="Nach oben"><Icon name="chevronUp" size={17} /></button>
                    <button className="icon-btn sm" onClick={() => moveCategory(c.id, 1)} disabled={idx === cats.length - 1} aria-label="Nach unten"><Icon name="chevronDown" size={17} /></button>
                    <button className="icon-btn sm" onClick={() => setEditing(c)} aria-label={`${c.name} bearbeiten`}><Icon name="edit" size={17} /></button>
                    <button className="icon-btn sm danger" onClick={() => setDeleting(c)} aria-label={`${c.name} löschen`}><Icon name="trash" size={17} /></button>
                  </div>
                </li>
              ))}
            </ul>
          </section>
        ))}
      </div>

      {editing && (
        <CategoryEditor category={editing === 'new' ? null : editing} onClose={() => setEditing(null)} />
      )}

      {deleting && (
        <ConfirmDialog
          title="Kategorie löschen?"
          message={
            counts[deleting.id]
              ? `„${deleting.name}“ ist ${counts[deleting.id]} Rezept(en) zugeordnet. Die Rezepte bleiben erhalten, verlieren aber diese Zuordnung.`
              : `„${deleting.name}“ wird dauerhaft gelöscht.`
          }
          onConfirm={confirmDelete}
          onCancel={() => setDeleting(null)}
        />
      )}
    </div>
  );
}

function RecipePicker({ onClose }) {
  const { recipes, addRecipesToShopping, toast } = useStore();
  const [picked, setPicked] = useState({}); // id -> servings

  const toggle = (r) =>
    setPicked((p) => {
      const next = { ...p };
      if (next[r.id]) delete next[r.id];
      else next[r.id] = r.servings;
      return next;
    });

  const add = () => {
    const selections = Object.entries(picked).map(([id, servings]) => ({ recipe: recipes.find((r) => r.id === id), servings }));
    addRecipesToShopping(selections);
    toast(`Zutaten aus ${selections.length} Rezept(en) hinzugefügt`);
    onClose();
  };

  const count = Object.keys(picked).length;

  return (
    <Modal
      title="Rezepte zur Einkaufsliste"
      onClose={onClose}
      wide
      footer={
        <>
          <button className="btn btn-ghost" onClick={onClose}>Abbrechen</button>
          <button className="btn btn-primary" onClick={add} disabled={!count}>
            <Icon name="cart" size={17} /> {count ? `${count} Rezept(e) hinzufügen` : 'Rezepte wählen'}
          </button>
        </>
      }
    >
      <p className="muted small">Wähle Rezepte und Portionen – gleiche Zutaten werden automatisch zusammengeführt.</p>
      <ul className="picker-list">
        {recipes.map((r) => (
          <li key={r.id} className={`picker-row ${picked[r.id] ? 'on' : ''}`}>
            <label className="picker-main">
              <input type="checkbox" checked={!!picked[r.id]} onChange={() => toggle(r)} />
              <RecipeImage recipe={r} className="thumb" />
              <span>{r.title}</span>
            </label>
            {picked[r.id] && (
              <Stepper value={picked[r.id]} onChange={(v) => setPicked((p) => ({ ...p, [r.id]: v }))} label="Portionen" />
            )}
          </li>
        ))}
      </ul>
    </Modal>
  );
}

function RecipeDetailPage({ id }) {

  const recipe = recipes.find((r) => r.id === id);

  const [servings, setServings] = useState(recipe?.servings || 2);
  const [checked, setChecked] = useState({});
  const [doneSteps, setDoneSteps] = useState({});
  const [experience, setExperience] = useState(recipe?.experience || '');
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [favPulse, setFavPulse] = useState(false);
  const [confirmImageRemove, setConfirmImageRemove] = useState(false);
  const [imageBusy, setImageBusy] = useState(false);
  const [dragOver, setDragOver] = useState(false);
  const [framing, setFraming] = useState(null); // { src, initial, isNew }
  const fileRef = useRef(null);
  const heroRef = useRef(null);

  useEffect(() => {
    if (!recipe) return;
    markUsed(id);
    setServings(recipe.servings);
    setChecked({});
    setDoneSteps({});
    setExperience(recipe.experience || '');
  }, [id]);

  if (!recipe) {
    return (
      <div className="page">
        <EmptyState icon="alert" title="Rezept nicht gefunden" text="Vielleicht wurde es gelöscht." action={<Link to="/rezepte" className="btn btn-primary">Zur Übersicht</Link>} />
      </div>
    );
  }

  const factor = servings / recipe.servings;
  const cats = recipe.categoryIds.map((cid) => categories.find((c) => c.id === cid)).filter(Boolean);

  const fav = () => {
    toggleFavorite(recipe.id);
    setFavPulse(true);
    setTimeout(() => setFavPulse(false), 450);
    toast(recipe.favorite ? 'Aus Favoriten entfernt' : 'Zu Favoriten hinzugefügt');
  };

  const share = async () => {
    const text = recipeToText(recipe, categories);
    try {
      if (navigator.share) {
        await navigator.share({ title: recipe.title, text });
        return;
      }
      await navigator.clipboard.writeText(text);
      toast('Rezept als Text in die Zwischenablage kopiert');
    } catch (e) {
      if (e?.name !== 'AbortError') toast('Teilen nicht möglich', 'error');
    }
  };

  const duplicate = () => {
    const newId = duplicateRecipe(recipe.id);
    toast('Rezept dupliziert');
    navigate(`/rezept/${newId}/bearbeiten`);
  };

  const remove = () => {
    deleteRecipe(recipe.id);
    toast(`„${recipe.title}“ gelöscht`);
    navigate('/rezepte', { replace: true });

  const toShopping = () => {
    addRecipesToShopping([{ recipe, servings }]);
    toast(`Zutaten für ${servings} Portionen zur Einkaufsliste hinzugefügt`);
  };

  const saveExperience = () => {
    updateRecipe(recipe.id, { experience });
    toast('Notiz gespeichert');

  // Foto direkt auf der Detailseite hinzufügen, ändern oder entfernen.
  // Neue Fotos werden erst gespeichert, nachdem der Ausschnitt gewählt wurde.
  const setImage = async (file) => {
    if (!file) return;
    if (!file.type.startsWith('image/')) return toast('Bitte eine Bilddatei wählen', 'error');
    setImageBusy(true);
    try {
      setFraming({ src: await resizeImage(file), initial: null, isNew: true });
    } catch {
      toast('Bild konnte nicht gelesen werden', 'error');
    }
    setImageBusy(false);
  };

  const saveFrame = (frame) => {
    const hadImage = !!recipe.image;
    updateRecipe(recipe.id, { image: framing.src, imageFrame: frame });
    toast(!framing.isNew ? 'Ausschnitt gespeichert' : hadImage ? 'Foto geändert' : 'Foto hinzugefügt');
    setFraming(null);
  };

  // Seitenverhältnis des Titelbilds und der vom Textfeld verdeckte Anteil – für eine genaue Vorschau
  const heroBox = () => {
    const el = heroRef.current;
    if (!el) return { aspect: 2.4, coverBottom: 0 };
    const { width, height } = el.getBoundingClientRect();
    const overlap = parseFloat(getComputedStyle(el.parentElement).getPropertyValue('--overlap')) || 0;
    return { aspect: width / height, coverBottom: overlap / height };
  };

  const onImageInput = (e) => {
    const file = e.target.files?.[0];
    e.target.value = '';
    setImage(file);
  };

  const onDrop = (e) => {
    e.preventDefault();
    setDragOver(false);
    setImage(e.dataTransfer.files?.[0]);
  };

  const removeImage = () => {
    updateRecipe(recipe.id, { image: null, imageFrame: null });
    setConfirmImageRemove(false);
    toast('Foto entfernt');

  const checkedCount = Object.values(checked).filter(Boolean).length;

  return (
    <div className="page detail">
      <div
        ref={heroRef}
        className={`detail-hero ${dragOver ? 'drag-over' : ''}`}
        onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
        onDragLeave={(e) => { if (!e.currentTarget.contains(e.relatedTarget)) setDragOver(false); }}

      >
        <RecipeImage recipe={recipe} className="hero-main" />
        <div className="hero-shade" />
        {!recipe.image && (
          <button className="btn hero-add-image" onClick={() => fileRef.current.click()} disabled={imageBusy}>
            <Icon name="image" size={18} /> {imageBusy ? 'Wird geladen …' : 'Foto hinzufügen'}

          <div className="hero-drop">
            <Icon name="upload" size={30} />
            <span>Foto hier ablegen</span>
          </div>

        <div className="hero-top">
          <button className="icon-btn glass" onClick={() => navigate(lastPathOutside(`/rezept/${recipe.id}`, '/rezepte'))} aria-label="Zurück">
            <Icon name="arrowLeft" />
          </button>
          <div className="hero-tools">
            {recipe.image && (
              <>
                <button className="icon-btn glass" onClick={() => setFraming({ src: recipe.image, initial: recipe.imageFrame, isNew: false })} aria-label="Ausschnitt anpassen" title="Ausschnitt anpassen">
                  <Icon name="move" />
                </button>
                <button className="icon-btn glass" onClick={() => fileRef.current.click()} disabled={imageBusy} aria-label="Foto ändern" title="Foto ändern">
                  <Icon name="image" />
                </button>
                <button className="icon-btn glass danger" onClick={() => setConfirmImageRemove(true)} aria-label="Foto entfernen" title="Foto entfernen">
                  <Icon name="trash" />
                </button>
              </>
            )}
            <button className={`icon-btn glass fav-big ${recipe.favorite ? 'on' : ''} ${favPulse ? 'pulse' : ''}`} onClick={fav} aria-pressed={recipe.favorite} aria-label={recipe.favorite ? 'Aus Favoriten entfernen' : 'Als Favorit markieren'}>
              <Icon name="heart" filled={recipe.favorite} />
            </button>
          </div>
        </div>
        <input ref={fileRef} type="file" accept="image/*" hidden onChange={onImageInput} />
      </div>

      <div className="detail-sheet">
      <div className="detail-scroll">
      <div className="detail-content">
        <div className="detail-title">
          <h1>{recipe.title}</h1>
          {recipe.rating > 0 && <Stars value={recipe.rating} size={16} />}
        </div>

        {cats.length > 0 && (
          <div className="chip-row wrap">
            {cats.map((c) => <CategoryTag key={c.id} category={c} small onClick={() => navigate(`/rezepte?kat=${c.id}`)} />)}

          <div className="fact"><Icon name="clock" /><span className="fact-label">Gesamt</span><strong>{formatMinutes(totalTime(recipe))}</strong></div>
          {recipe.difficulty && <div className="fact"><Icon name="chef" /><span className="fact-label">Schwierigkeit</span><strong className="cap">{recipe.difficulty}</strong></div>}
        </div>

        <div className="action-bar">

        <div className="detail-grid">

            <button className="btn btn-outline btn-block" onClick={toShopping}>
